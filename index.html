<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa da Via Láctea</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#eef0f5;--pn:#fff;--tx:#1a1e2b;--mu:#586075;--bd:#d3d8e4;--ac:#4a63e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07090f;--pn:#131824;--tx:#e9ecf5;--mu:#97a1b8;--bd:#273046;--ac:#8aa0ff}}
:root[data-theme="dark"]{--bg:#07090f;--pn:#131824;--tx:#e9ecf5;--mu:#97a1b8;--bd:#273046;--ac:#8aa0ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Source Sans 3",system-ui,sans-serif;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#000;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#img{display:block;user-select:none;-webkit-user-drag:none}
.mk{position:absolute;transform:translate(-50%,-50%) scale(var(--inv,1));width:46px;height:46px;border-radius:50%;background:none;border:0;padding:0;cursor:pointer;color:#fff}
.mk i{position:absolute;inset:9px;border-radius:50%;border:2px solid var(--c);opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;box-shadow:0 0 16px var(--c)}
.mk:hover i,.mk:focus-visible i{opacity:.9;transform:scale(1)}
.mk.on i{opacity:1;transform:scale(1);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--c),0 0 16px var(--c)}100%{box-shadow:0 0 0 24px transparent,0 0 16px var(--c)}}
.mk b{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:-4px;padding:2px 8px;border-radius:6px;background:rgba(5,8,15,.88);font:600 13px "Spectral",serif;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.mk:hover b,.mk:focus-visible b,.mk.on b{opacity:1}
.mk:focus-visible{outline:2px solid #fff;outline-offset:-2px}
#bar{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
#bar>*{pointer-events:auto}
#bar input,#bar button,.chip{background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;font:inherit}
#q{width:200px}
.chip{display:flex;align-items:center;gap:7px;cursor:pointer}
.chip i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.45}
#panel{position:absolute;right:10px;top:calc(62px + env(safe-area-inset-top,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:340px;max-width:calc(100% - 20px);background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:16px;overflow:auto;display:none}
#panel.open{display:block}
#panel label{display:block;margin-top:12px;font-weight:600;color:var(--mu);font-size:13px}
#panel input,#panel textarea,#panel select{width:100%;margin-top:4px;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}
#panel textarea{min-height:76px;resize:vertical}
#panel #n{font:700 22px "Spectral",serif;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:2px 0}
#panel [readonly],#panel select:disabled{border-color:transparent;padding-left:0}
#x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--mu);font-size:22px;cursor:pointer}
#hint{position:absolute;left:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));color:#aab2c6;font-size:12px;text-shadow:0 0 4px #000}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
@media(max-width:640px){#panel{top:auto;left:10px;right:10px;width:auto;max-width:none;height:56%}#q{width:100%}}
.layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;user-select:none;transition:opacity .5s}
.layer.ter{opacity:.85}.layer.hide{opacity:0}
#world.fly{transition:transform .85s cubic-bezier(.22,.8,.25,1)}
#panel{border-top:3px solid var(--c,var(--bd))}
@media(prefers-reduced-motion:reduce){.mk.on i{animation:none}#world.fly{transition:none}.layer{transition:none}}
#tabs{display:flex;gap:2px;margin-top:10px;border-bottom:1px solid var(--bd);overflow-x:auto}
#tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 9px;color:var(--mu);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
#tabs button[aria-selected="true"]{color:var(--tx);border-bottom-color:var(--c,var(--ac))}
#src{margin:10px 0 0;color:var(--mu);font-size:12px}#wk{display:inline-block;margin-top:10px;color:var(--ac);font-size:13px}
[hidden]{display:none!important}
#dpop{position:absolute;left:10px;top:calc(62px + env(safe-area-inset-top,0px));z-index:6;width:min(320px,calc(100% - 20px));background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
#dpop button{background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;font:inherit;cursor:pointer;text-align:left}
#dpop textarea{min-height:140px;width:100%;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px monospace}
#dmsg{margin:0;color:var(--mu);font-size:12px}
.ico{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
#bar,#panel{z-index:3}
#world.cine{transition:transform 1.15s cubic-bezier(.55,0,.85,.35),opacity .8s ease .35s}
#world.back{transition:transform 1s cubic-bezier(.2,.7,.2,1),opacity .7s ease}
#world.out{opacity:0}#world.gone{pointer-events:none}
#scene{position:absolute;left:0;top:0;bottom:0;right:360px;z-index:2;padding-top:58px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0e1424 0%,#03050a 75%);opacity:0;pointer-events:none;transition:opacity .6s ease}
#scene.on{opacity:1;pointer-events:auto}
#simg{max-width:94%;max-height:88%;object-fit:contain;opacity:0;transform:scale(1.14);transition:opacity .7s ease,transform 1.2s ease-out}
#scene.on #simg{opacity:1;transform:scale(1)}
#panel{transition:opacity .45s ease,transform .45s ease}
#panel.late{opacity:0;transform:translateX(26px);pointer-events:none}
@media(max-width:640px){#scene{right:0;bottom:56%}}
@media(prefers-reduced-motion:reduce){#world.cine,#world.back,#scene,#simg,#panel{transition:none}}
</style>
</head>
<body>
<div id="stage"><div id="world"><img id="img" alt="Mapa da Via Láctea"><div class="layer" id="L-pl"></div></div></div>
<div id="scene"><img id="simg" alt=""></div>
<div id="bar">
  <input id="q" list="nomes" placeholder="Buscar planeta" aria-label="Buscar planeta" autocomplete="off">
  <datalist id="nomes"></datalist>
  <span id="chips" style="display:contents"></span>
  <button id="mode" aria-pressed="true">Modo mestre</button>
  <button id="fit">Ver tudo</button>
  <button id="dados">Dados</button>
</div>
<div id="dpop" hidden>
  <button id="b-imp">Importar arquivos JSON</button><input id="imp" type="file" accept=".json,application/json" multiple hidden>
  <button id="b-exp">Copiar planetas.json atual</button>
  <button id="b-clr">Voltar aos dados originais</button>
  <textarea id="dout" readonly hidden></textarea>
  <p id="dmsg"></p>
</div>
<aside id="panel">
  <button id="x" aria-label="Fechar">×</button>
  <input id="n" aria-label="Nome">
  <div id="tabs" role="tablist"><button role="tab" aria-selected="true" data-t="a">Informações</button><button role="tab" aria-selected="false" data-t="b">Missões e procurados</button><button role="tab" aria-selected="false" data-t="c">Pontos de interesse</button></div>
  <section id="tab-a">
    <label>Facção<select id="f"><option value="">Nenhuma</option><option>Encanadores</option><option>Inkursianos</option><option>Skojares</option></select></label>
    <label>Descrição<textarea id="d" placeholder="Ainda sem texto. Escreva aqui ou consulte o wiki."></textarea></label>
    <label>Espécies habitantes<textarea id="e" placeholder="Ainda sem espécies registradas."></textarea></label>
    <p id="src" hidden>Descrição e espécies resumidas do Ben 10 Wiki.</p>
    <a id="wk" target="_blank" rel="noopener">Procurar no Ben 10 Wiki</a>
  </section>
  <section id="tab-b" hidden>
    
    <label>Procurados<textarea id="w"></textarea></label>
    <label>Missões<textarea id="s"></textarea></label>
  </section>
  <section id="tab-c" hidden>
    <label>Pontos de interesse<textarea id="p" style="min-height:200px" placeholder="Um ponto de interesse por linha."></textarea></label>
  </section>
</aside>
<div id="hint">Arraste para mover, role ou use dois dedos para dar zoom. Alterações ficam salvas neste aparelho. Fundo: NASA/JPL-Caltech/R. Hurt (SSC-Caltech).</div>
<script>
let REF_W=1728,REF_H=1834;const K="mapaRPG:v2";
const DEF={"config": {"fundo": "mapa/fundo.jpg", "referencia": {"largura": 1728, "altura": 1834}, "escala_icones": 6000, "contorno": {"cor": "#ffffff", "largura": 6, "opacidade": 0.85}}, "faccoes": {"Encanadores": {"cor": "#86e04a", "territorio": "mapa/territorio-encanadores.png"}, "Inkursianos": {"cor": "#9a7ee6", "territorio": "mapa/territorio-inkursianos.png"}, "Skojares": {"cor": "#f0524a", "territorio": "mapa/territorio-skojares.png"}}, "planetas": [{"id": "galvan", "nome": "Galvan", "faccao": "Encanadores", "posicao": {"x": 866, "y": 301}, "descricao": "Galvan Prime (Galvan Mark II depois de reconstruído) é um planeta minúsculo, mas altamente avançado, um dos mundos mais desenvolvidos cientificamente da galáxia, com arranha-céus em miniatura e vias ultrarrápidas. Foi invadido pelos Highbreed e depois reconstruído. Fica a cerca de 76.000 anos-luz da Terra. Sua lua, Galvan B, abriga os Mechamorfos Galvânicos.", "especies": ["Galvanianos", "Omnivorazes (extintos, antigos habitantes)", "Mecamorfos Galvânicos (na lua Galvan B)"], "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/galvan.jpg", "wiki": "Galvan Prime", "icone": "icones/galvan.png"}, {"id": "encephalonus-iv", "nome": "Encephalonus IV", "faccao": "Encanadores", "posicao": {"x": 1065, "y": 366}, "descricao": "Planeta de tempestades. Os antepassados dos habitantes esgotaram a eletricidade natural de Encephalonus I, II e III. Os atuais fazem o contrário: geram as tempestades elétricas do próprio mundo só de pensar com força.", "especies": "Cerebrocrustaceanos", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/encephalonus-iv.jpg", "wiki": "Encephalonus IV", "icone": "icones/encephalonus-iv.png"}, {"id": "sonorosia", "nome": "Sonorosia", "faccao": "Encanadores", "posicao": {"x": 898, "y": 454}, "descricao": "Lar dos Sonorosianos. Tem desfiladeiros e cânions imensos, com camadas coloridas de rocha. Só os Sonorosianos manipulam ondas sonoras naturalmente, mas outras criaturas usam as cavernas como câmaras de sussurro ou para gerar ecos de defesa.", "especies": "Sonorosianos", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/sonorosia.jpg", "wiki": "Sonorosia", "icone": "icones/sonorosia.png"}, {"id": "revonnah", "nome": "Revonnah", "faccao": "Encanadores", "posicao": {"x": 1125, "y": 451}, "descricao": "Mundo belo e imponente, com vários sóis. O relevo acidentado tem fazendas em terraços cortados nas montanhas, com silos e casas simples. É onde cresce a fruta Amber Ogia, e a tarefa mais empolgante é manter os Muroids longe dos silos de grãos.", "especies": ["Revonnahganderos", "Muróides"], "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/revonnah.jpg", "wiki": "Revonnah", "icone": "icones/revonnah.png"}, {"id": "dreck", "nome": "Dreck", "faccao": "Skojares", "posicao": {"x": 836, "y": 486}, "descricao": "", "especies": "", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "", "wiki": "Dreck", "icone": "icones/dreck.png"}, {"id": "kanbhar", "nome": "Kanbhar", "faccao": "Skojares", "posicao": {"x": 886, "y": 538}, "descricao": "", "especies": "", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "", "wiki": "Kanbhar", "icone": "icones/kanbhar.png"}, {"id": "sulcus", "nome": "Sulcus", "faccao": "Encanadores", "posicao": {"x": 1128, "y": 598}, "descricao": "Planeta da Via Láctea em cuja órbita fica o Grande Cofre de Sulcus.", "especies": "Sem espécie nativa registrada.", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/sulcus.jpg", "wiki": "Sulcus", "icone": "icones/sulcus.png"}, {"id": "petropia", "nome": "Petropia", "faccao": "Encanadores", "posicao": {"x": 1169, "y": 757}, "descricao": "Planeta rochoso em forma de geodo, que lembra uma massa de cristais verticais pontiagudos, com formato de ampulheta e ao menos três satélites cristalinos. Os Petrosapiens construíram reinos subterrâneos sob a superfície. Seu sistema tem três sóis, e o planeta é muito maior que a Terra. É guardado por Sugilite.", "especies": ["Petrosapiens", "Crystalsapiens"], "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/petropia.jpg", "wiki": "Petropia", "icone": "icones/petropia.png"}, {"id": "methanos", "nome": "Methanos", "faccao": "Encanadores", "posicao": {"x": 1351, "y": 763}, "descricao": "Lar dos Methanosianos. Planeta pantanoso. O nome é um trocadilho com metano.", "especies": "Methanosianos", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/methanos.jpg", "wiki": "Methanos", "icone": "icones/methanos.png"}, {"id": "flors-verdance", "nome": "Flors Verdance", "faccao": "Encanadores", "posicao": {"x": 1545, "y": 783}, "descricao": "Mundo exuberante de grama, árvores e outras plantas vivas. Por causa dos três sóis, o clima muda rápido e a vida segue ciclos sazonais. O nome vem de \"flora\" e \"verdant\" (verde).", "especies": "Florauna", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/flors-verdance.jpg", "wiki": "Flors Verdance", "icone": "icones/flors-verdance.png"}, {"id": "keplorr", "nome": "Keplorr", "faccao": "Encanadores", "posicao": {"x": 1440, "y": 869}, "descricao": "Planeta constantemente orbitado por Galileanos. Embora seja o lar deles, nenhum Galileano jamais pisou nele: vivem em órbita, como elétrons em volta de um núcleo. Quanto mais Galileanos orbitam, maior a energia do sistema, até serem lançados ao espaço. Depois voltam por instinto para se recarregar.", "especies": "Galileanos (em órbita)", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "", "wiki": "Keplorr", "icone": "icones/keplorr.png"}, {"id": "appoplexia", "nome": "Appoplexia", "faccao": "Encanadores", "posicao": {"x": 1076, "y": 857}, "descricao": "Lar dos Appoplexianos. Tem climas frios. O Império Appoplexiano teve 99 comandantes supremos, sendo Vexx o 99º. Seu povo tem senso de vergonha e sempre usa roupas. Mantém uma trégua frágil com Lewoda.", "especies": "Appoplexianos", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/appoplexia.jpg", "wiki": "Appoplexia", "icone": "icones/appoplexia.png"}, {"id": "aranhascimia", "nome": "Aranhascimia", "faccao": "Encanadores", "posicao": {"x": 1229, "y": 936}, "descricao": "Lar dos Arachnachimps. Vista do espaço, é verde-limão com manchas verdes mais escuras e grandes nuvens, e do chão o céu é roxo. Tem florestas tropicais com árvores gigantes e rochas suspensas em várias alturas, sempre escuras sob as copas. Grandes corpos de água abrigam os tubarões de raíz. Tem duas luas.", "especies": ["Arachnachimps", "Tubarões de raíz (predadores)"], "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/aranhascimia.jpg", "wiki": "Aranhascimmia", "icone": "icones/aranhascimia.png"}, {"id": "chordelta-star-world-beta", "nome": "Chordelta Star World Beta", "faccao": "Encanadores", "posicao": {"x": 1331, "y": 992}, "descricao": "", "especies": "Snidellerodontus", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "", "wiki": "Chordelta Star World Beta", "icone": "icones/chordelta-star-world-beta.png"}, {"id": "lepidopterra", "nome": "Lepidopterra", "faccao": "Encanadores", "posicao": {"x": 1521, "y": 968}, "descricao": "Lar dos Lepidopterranos e dos Lagartóides. É um planeta pantanoso, em geral pacífico, com ecossistema avançado e plantas gigantes. Os Lepidopterranos vivem em complexos de colmeias gigantes, cada uma com sua rainha, e passam a vida colhendo as plantas. Os Lagartóides vivem em cavernas.", "especies": ["Lepidopterranos", "Lagartóides"], "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/lepidopterra.jpg", "wiki": "Lepidopterra", "icone": "icones/lepidopterra.png"}, {"id": "vilgaxia", "nome": "Vilgaxia", "faccao": "", "posicao": {"x": 781, "y": 933}, "descricao": "Mundo natal dos Chimera Sui Generis, no sistema Shadow Realm. A cidade principal fica nas bordas de planícies e montanhas verde-pálidas, com um palácio-fortaleza onde vive Vilgax. Antes se chamava Murray e foi renomeado por Vilgax.", "especies": "Chimera Sui Generis", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "", "wiki": "Vilgaxia", "icone": "icones/vilgaxia.png"}, {"id": "khoros", "nome": "Khoros", "faccao": "Encanadores", "posicao": {"x": 1043, "y": 1048}, "descricao": "Lar dos Tetramandos. Tem paisagem árida e plana por causa dos dois sóis, com areia cor de vinho cobrindo quase tudo, firme o bastante para andar e pousar naves e lisa o bastante para os Sandrippers nadarem nela. Há penhascos, vales e grandes predadores.", "especies": ["Tetramandos", "Khoros Reptilianos", "Sandrippers", "Bharthacks"], "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/khoros.jpg", "wiki": "Khoros", "icone": "icones/khoros.png"}, {"id": "cafe-espacial", "nome": "Café Espacial", "faccao": "Encanadores", "posicao": {"x": 1153, "y": 1053}, "descricao": "", "especies": "", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/cafe-espacial.jpg", "wiki": "Café Espacial", "icone": "icones/cafe-espacial.png"}, {"id": "pyros", "nome": "Pyros", "faccao": "Encanadores", "posicao": {"x": 1228, "y": 1134}, "descricao": "Sol totalmente funcional e mundo natal dos Pyronitas. Travou várias guerras contra Piscciss. Tem colunas infernais de fogo e rios de lava na tundra em chamas.", "especies": ["Pyronitas", "Crabdozers (nativos que orbitam o sistema como asteroides)"], "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/pyros.jpg", "wiki": "Pyros", "icone": "icones/pyros.png"}, {"id": "piscciss", "nome": "Piscciss", "faccao": "Encanadores", "posicao": {"x": 1267, "y": 1148}, "descricao": "Planeta artificial formado por um oceano gigante, com terra firme apenas em rochas flutuantes e no núcleo (menos de 2% da massa). Um multiplicador artificial de gravidade no centro mantém a água unida. Quase todas as espécies são predadoras, e antes da série original o planeta travou várias guerras contra Pyros.", "especies": ["Piscciss Volanns (perto da superfície)", "Piscciss Premanns"], "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/piscciss.jpg", "wiki": "Piscciss", "icone": "icones/piscciss.png"}, {"id": "gilli-perambulous-promenade", "nome": "Gilli-Perambulous Promenade", "faccao": "Encanadores", "posicao": {"x": 1215, "y": 1155}, "descricao": "Lar dos Ickthyperambuloids. Tem calçadas naturais, alguma vegetação e trilhas, e é famoso por ter mais calçadas que qualquer civilização conhecida, segundo os Registros Galácticos. O nome vem de \"gill\", \"perambulate\" e \"promenade\".", "especies": "Ickthyperambuloids", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "", "wiki": "Gilli-Perambulous Promenade", "icone": "icones/gilli-perambulous-promenade.png"}, {"id": "aeropela", "nome": "Aeropela", "faccao": "Encanadores", "posicao": {"x": 979, "y": 1098}, "descricao": "Lar dos Aerophibianos. É coberto de água, sem nenhum ponto de terra seca. Todos os habitantes evoluíram para viver sob o mar ou no céu, e dependem dos Aerophibianos para a comunicação entre os dois mundos. É descrito como um mundo aquoso, com chuva, neblina, umidade e furacões constantes.", "especies": "Aerophibianos", "procurados": "", "missoes": "", "pontos_de_interesse": "", "imagem": "imagens/aeropela.jpg", "wiki": "Aeropela", "icone": "icones/aeropela.png"}, {"id": "terradino", "nome": "Terradino", "faccao": "Encanadores", "posicao": {"x": 730, "y": 1118}, "descricao": "Mundo natal dos Vaxasaurianos e dos Kaosseffexx Ultimasaurias. É belo, montanhoso e exuberante, com muitas espécies animalescas. Visto do espaço, lembra a Terra, mas suas espécies não evoluíram para conviver em paz. O nome mistura \"terra\" e \"dino\".", "especies": ["Vaxasaurianos", "Kaosseffexx Ultimasaurias (Tyranópode)  if(ptr.size===1){x+=e.clientX-o[0];y+=e.clientY-o[1];moved+=Math.abs(e.clientX-o[0])+Math.abs(e.clientY-o[1]);apply()}
 else if(ptr.size===2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),r=st.getBoundingClientRect();if(lastD)zoomAt((a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,d/lastD);lastD=d;moved=99}});
["pointerup","pointercancel"].forEach(t=>addEventListener(t,e=>{ptr.delete(e.pointerId);lastD=0}));
st.addEventListener("wheel",e=>{e.preventDefault();const r=st.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15)},{passive:false});
addEventListener("resize",fitView);
img.complete&&img.naturalWidth?fitView():img.addEventListener("load",fitView);

const msg=s=>{$("#dmsg").textContent=s};
let ERR=[];
async function lerJSON(u){try{const r=await fetch(u,{cache:"no-store"});if(!r.ok)return null;return await r.json()}catch(e){if(e instanceof SyntaxError)ERR.push(u+": "+e.message);return null}}
async function boot(){
 ERR=[];let d={config:DEF.config,faccoes:DEF.faccoes,planetas:DEF.planetas};SRC="dados embutidos na página";
 try{const imp=JSON.parse(localStorage.getItem("mapaRPG:imp")||"{}");if(imp.planetas){d.planetas=imp.planetas;SRC="arquivos importados neste aparelho"}if(imp.faccoes)d.faccoes=imp.faccoes;if(imp.config)d.config=imp.config}catch(e){}
 const[a,b,c]=await Promise.all([lerJSON("dados/planetas.json"),lerJSON("dados/faccoes.json"),lerJSON("dados/config.json")]);
 if(Array.isArray(a)){d.planetas=a;SRC="arquivos da pasta dados"}if(b&&typeof b==="object")d.faccoes=b;if(c&&typeof c==="object")d.config=c;
 load(d);
 try{if(localStorage.getItem(K)===null){const o=JSON.parse(localStorage.getItem("mapaRPG:v1")||"{}"),n={};DEF.planetas.forEach((p,i)=>{if(o[i])n[p.id]=o[i]});saved=n;put()}}catch(e){}
 build();
 if(ERR.length){$("#dpop").hidden=false;$("#dout").hidden=true;msg("Erro de sintaxe em "+ERR.join(" | ")+". Usando outros dados até você corrigir o arquivo.")}
}
function snapshot(){return P.map((p,i)=>{const o={id:ID[i],nome:val(i,"n"),faccao:val(i,"f"),posicao:{x:p[1],y:p[2]}};for(const[k,f]of[["d","descricao"],["e","especies"],["w","procurados"],["s","missoes"],["p","pontos_de_interesse"]]){const v=val(i,k);o[f]=v.includes("\n")?v.split("\n"):v}o.imagem=IMG[i];o.icone=ICO[i];o.wiki=WKN[p[0]]||"";return o})}
$("#dados").onclick=()=>{const h=$("#dpop");h.hidden=!h.hidden;if(!h.hidden){$("#dout").hidden=true;msg("Fonte atual: "+SRC+". Shift+clique no mapa mostra a posição x e y.")}};
$("#b-imp").onclick=()=>$("#imp").click();
$("#imp").onchange=async e=>{try{const imp=JSON.parse(localStorage.getItem("mapaRPG:imp")||"{}");for(const f of e.target.files){const j=JSON.parse(await f.text());if(Array.isArray(j))imp.planetas=j;else if(j&&typeof j==="object"){if(j.fundo||j.referencia||j.contorno||j.escala_icones)imp.config=j;else imp.faccoes=j}}localStorage.setItem("mapaRPG:imp",JSON.stringify(imp));saved={};put();await boot();msg("Importado. As edições feitas neste aparelho foram descartadas.")}catch(err){msg("Arquivo inválido: "+err.message)}e.target.value=""};
$("#b-exp").onclick=async()=>{const j=JSON.stringify(snapshot(),null,2);try{await navigator.clipboard.writeText(j);msg("JSON copiado. Cole no arquivo dados/planetas.json.")}catch(err){const o=$("#dout");o.hidden=false;o.value=j;o.focus();o.select();msg("Selecione tudo e copie o texto acima para dados/planetas.json.")}};
let cf=0;$("#b-clr").onclick=e=>{const b=e.target;if(!cf){cf=1;b.textContent="Tem certeza? Toque de novo";setTimeout(()=>{cf=0;b.textContent="Voltar aos dados originais"},4000);return}cf=0;b.textContent="Voltar aos dados originais";try{localStorage.removeItem("mapaRPG:imp")}catch(_){}saved={};put();boot().then(()=>msg("Dados originais restaurados."))};
st.addEventListener("click",e=>{if(!e.shiftKey||moved>6)return;const r=st.getBoundingClientRect(),W=img.naturalWidth,H=img.naturalHeight;$("#dpop").hidden=false;$("#dout").hidden=true;msg('Posição clicada: "x": '+(((e.clientX-r.left-x)/s)/W*REF_W).toFixed(1)+', "y": '+(((e.clientY-r.top-y)/s)/H*REF_H).toFixed(1))});
addEventListener("keydown",e=>{if(e.key==="Escape"){if(scene)leave();else $("#x").click()}});
boot();
</script>
</body>
</html>
